<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riko</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/riko.png">
</head>
<body>
    <!-- 
        SCENE CONTAINER
        Currently holds the PNG character + ambient environment.
        FUTURE: This entire container becomes the Three.js / 3D canvas.
        The UI overlay sits on top regardless.
    -->
    <div id="scene" class="scene">
        <!-- Ambient environment layer (particles, lighting, atmosphere) -->
        <div id="environment" class="environment"></div>

        <!-- Character layer — PNG now, 3D model later -->
        <div id="characterContainer" class="character-container">
            <div class="character-ground" id="characterGround"></div>
            <div class="character-aura" id="characterAura"></div>
            <img 
                id="characterImage"
                class="character-image"
                src="assets/riko.png"
                alt="Riko"
                draggable="false"
            >
        </div>

        <!-- UI OVERLAY — stays on top of any 3D scene -->
        <div class="ui-overlay">
            <!-- Close button -->
            <button class="close-btn" id="closeBtn" title="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Title -->
            <div class="header">
                <h1 class="title">RIKO</h1>
                <p class="subtitle">your companion</p>
            </div>

            <!-- State indicator -->
            <div class="state-indicator" id="stateIndicator">
                <span class="state-dot" id="stateDot"></span>
                <span class="state-text" id="stateText">Idle</span>
            </div>

            
<!-- Main action button -->

            <button class="action-btn" id="actionBtn">
                <div class="action-btn-inner">
                    <svg class="icon mic-icon" id="micIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    <svg class="icon stop-icon hidden" id="stopIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                    </svg>
                    <svg class="icon thinking-icon hidden" id="thinkingIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" stroke-dasharray="4 4" class="thinking-ring"></circle>
                    </svg>
                    <svg class="icon speaking-icon hidden" id="speakingIcon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    </svg>
                    <span class="action-text" id="actionText">Talk</span>
                </div>
            </button>
        </div>
    </div>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>
</html>
